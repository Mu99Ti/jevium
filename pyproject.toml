[project]
name = "jevium"
version = "0.1.0"
description = "Jevium: site+task browser agent with human-in-the-loop pauses."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["browser-harness==0.1.13", "httpx[http2]>=0.28,<1",
                "playwright>=1.40,<2", "textual>=1.0,<8"]

[project.scripts]
jev = "jevium_core.demo:main"
jevium = "jevium.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jevium_core", "jevium"]

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.14,<1", "pillow>=11,<13"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: launches a real local browser, no model calls"]
